<!DOCTYPE html>
<html lang="th" class="antialiased">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Guard - Cyber Security Academy</title>

    <link href="https://db.onlinewebfonts.com/c/bb5de19d87c09a95216dc6ccd96e37c6?family=Nimbus+Sans+TW01" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
         :root {
            --font-main: 'Nimbus Sans TW01', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-thai: 'Prompt', sans-serif;
        }
        
        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            scroll-behavior: smooth;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: var(--font-thai);
            background-color: #0F172A;
            color: #111827;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .font-brand {
            font-family: var(--font-main);
        }
        
        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(24px);
                filter: blur(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }
        
        @keyframes fade-down {
            from {
                opacity: 0;
                transform: translateY(-16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes hero-rise {
            from {
                opacity: 0;
                transform: translateY(64px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .animate-fade-up {
            animation: fade-up 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        
        .animate-fade-down {
            animation: fade-down 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        
        .animate-hero-rise {
            animation: hero-rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        
        .quest-card {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
            border-radius: 28px;
        }
        
        .embed-box {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 20px;
            background: rgba(17, 24, 39, 0.04);
            border: 2px dashed rgba(17, 24, 39, 0.18);
            overflow: hidden;
            margin: 20px 0;
        }
        
        .embed-inner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState } = React; /* Icons */ function Logo({ className = "text-current w-5 h-5 sm:w-6 sm:h-6" }) { return (
        <svg viewBox="0 0 256 256" fill="currentColor" className={className}>
                    <path d="M 144 256 L 27.598 256 L 144 139.598 Z M 256 207.5 L 200 256 L 200 56 L 0 56 L 48 0 L 256 0 Z M 0 204.402 L 0 112 L 92.402 112 Z" />
                </svg> ); } /* Background Configuration */ const bgStyle = { backgroundImage: "url('https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260611_133301_d5f2a94a-b22e-4e4a-a6b6-eacdddf1f5b0.png&w=1280&q=85')"
        }; /* ================= Page 1: Home (Minimalist Design) ================= */ function HomePage({ onStart }) { return (
        <div className="relative min-h-[100svh] overflow-hidden bg-cover bg-center flex flex-col font-brand" style={bgStyle}>

            {/* Top Navbar: Just Logo */}
            <nav className="animate-fade-down relative z-20 px-5 sm:px-8 lg:px-10 py-6 flex items-center w-full">
                <div className="flex items-center gap-2 text-gray-900 font-bold text-xl sm:text-2xl">
                    <Logo />
                    <span>SmartGuard</span>
                </div>
            </nav>

            {/* Main Centered Content */}
            <main className="relative z-20 flex-1 flex flex-col items-center justify-center text-center px-5 pb-32">
                <h1 className="animate-fade-up text-gray-900 font-extrabold tracking-tight text-5xl sm:text-7xl lg:text-[80px]">
                    SMART GUARD
                </h1>

                <p className="animate-fade-up mt-6 text-gray-700 text-base sm:text-lg lg:text-xl leading-relaxed max-w-2xl font-thai" style={{ animationDelay: '150ms' }}>
                    เว็บไซต์เพื่อเสริมสร้างความรู้และทักษะด้านความมั่นคงปลอดภัยไซเบอร์<br className="hidden sm:block" /> เพื่อให้คุณสามารถป้องกันตนเองจากภัยคุกคามและการหลอกลวงบนโลกออนไลน์
                </p>

                <button onClick={onStart} className="animate-fade-up mt-10 bg-gray-900 text-white text-base sm:text-lg font-bold px-10 py-3.5 rounded-full hover:bg-gray-800 hover:scale-105 hover:shadow-xl transition-all font-thai cursor-pointer" style={{ animationDelay:
                    '300ms' }}>
                            เริ่มบทเรียน
                        </button>
            </main>
        </div>
        ); } /* ================= Page 2: Learning ================= */ const stepsData = [ { id: 1, title: "เช็กสกิล", icon: "📋" }, { id: 2, title: "เรียนรู้", icon: "🎬" }, { id: 3, title: "พิชิตด่าน", icon: "🎮" }, { id: 4, title: "ทบทวน", icon: "📊" }, {
        id: 5, title: "รับเกียรติบัตร", icon: "🎓" } ]; function LearningPage({ onBackToHome }) { const [currentStep, setCurrentStep] = useState(1); const [studentName, setStudentName] = useState(""); const [activeGame, setActiveGame] = useState(1); const
        [game1Passed, setGame1Passed] = useState(false); const [game2Passed, setGame2Passed] = useState(false); const [game3Passed, setGame3Passed] = useState(false); const [passInput, setPassInput] = useState(""); const getPassScore = () => { let score
        = 0; if (passInput.length >= 12) score += 25; if (/[A-Za-z\u0E00-\u0E7F]/.test(passInput)) score += 25; if (/[0-9]/.test(passInput)) score += 25; if (/[^A-Za-z0-9\u0E00-\u0E7F\s]/.test(passInput)) score += 25; return score; }; const [phishingSelections,
        setPhishingSelections] = useState([]); const [phishingResult, setPhishingResult] = useState(null); const phishingItems = [ { text: "ด่วน! ยืนยันตัวตนเพื่อรับรางวัล 500 บาท", suspicious: true }, { text: "ลิงก์จะใช้งานได้เพียง 24 ชั่วโมง", suspicious:
        true }, { text: "บัญชีของคุณถูกล็อกกรุณาเข้าสู่ระบบ", suspicious: true }, { text: "หากมีคำถาม ติดต่อฝ่ายบริการลูกค้าปกติ", suspicious: false }, { text: "อย่าป้อนรหัสผ่านบนเว็บไซต์ที่ไม่รู้จัก", suspicious: false } ]; const handlePhishingToggle
        = (idx) => { let newSelections = [...phishingSelections]; if (newSelections.includes(idx)) { newSelections = newSelections.filter(item => item !== idx); } else { newSelections.push(idx); } setPhishingSelections(newSelections); setPhishingResult(null);
        }; const handlePhishingSubmit = () => { const correctIndexes = phishingItems .map((item, index) => (item.suspicious ? index : -1)) .filter((index) => index >= 0); const selectedAllCorrect = correctIndexes.every((index) => phishingSelections.includes(index));
        const hasOnlyCorrect = phishingSelections.every((index) => correctIndexes.includes(index)); if (selectedAllCorrect && hasOnlyCorrect && phishingSelections.length > 0) { setPhishingResult({ success: true, message: "สำเร็จ! คุณแยกแยะอีเมลฟิชชิ่งได้ถูกต้อง"
        }); } else { setPhishingResult({ success: false, message: "ยังไม่ครบถ้วน ลองเลือกคำที่น่าสงสัยอีกครั้ง" }); } }; const handlePhishingReset = () => { setPhishingSelections([]); setPhishingResult(null); }; const [bossHP, setBossHP] = useState(100);
        const [bossQuestionIndex, setBossQuestionIndex] = useState(0); const [bossDefeated, setBossDefeated] = useState(false); const bossQuestions = [ { q: "ถ้ามีอีเมลแจ้งว่าคุณเป็นผู้โชคดีได้รับสิทธิ์สุ่ม iPhone 16 แต่ต้องกรอกเลขบัตรเครดิต ควรทำอย่างไร?",
        options: [ { text: "กรอกทันที กลัวเสียสิทธิ์", correct: false }, { text: "ลบอีเมลทิ้ง ไม่คลิกลิงก์เด็ดขาด", correct: true } ] }, { q: "การตั้ง Password แบบใดปลอดภัยที่สุด?", options: [ { text: "Smart#Guard2026!", correct: true }, { text: "12345678",
        correct: false } ] }, { q: "หากพบเพื่อนในโซเชียลส่งข้อความขอยืมเงินด่วน ควรทำอย่างไร?", options: [ { text: "โทรศัพท์หรือติดต่อยืนยันตัวตนเพื่อนโดยตรงก่อนโอน", correct: true }, { text: "รีบโอนทันทีเพราะเป็นเพื่อนสนิท", correct: false } ] } ]; const
        handleBossAttack = (isCorrect) => { if (isCorrect) { const newHP = Math.max(0, bossHP - 35); setBossHP(newHP); if (newHP
        <=0 ) { setBossDefeated(true); setGame3Passed(true); } else if (bossQuestionIndex < bossQuestions.length - 1) { setBossQuestionIndex(bossQuestionIndex
            + 1); } } else { alert( "❌ แฮกเกอร์ป้องกันการโจมตีได้! ลองเลือกคำตอบใหม่อีกครั้งครับ"); } }; const handleStepChange=( stepId)=> { setCurrentStep(stepId); window.scrollTo({ top: 0, behavior: 'smooth' }); }; const passScore = getPassScore(); let passScoreBg = "#EF4444"; if (passScore === 100) { passScoreBg = "#10B981"; } else if (passScore >= 50) { passScoreBg = "#F59E0B";
            } return (
            <div className="relative min-h-[100svh] overflow-hidden bg-cover bg-center flex flex-col pb-16" style={bgStyle}>

                <nav className="sticky top-0 z-50 bg-white/60 backdrop-blur-md border-b border-gray-200 px-4 py-3 flex items-center justify-between shadow-sm">
                    <button onClick={onBackToHome} className="text-gray-700 hover:bg-gray-100 px-3 py-1.5 rounded-lg flex items-center gap-2 text-sm font-medium transition-colors cursor-pointer">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                            หน้าแรก
                        </button>

                    <div className="hidden md:flex gap-1 bg-white/50 p-1 rounded-full border border-gray-200 shadow-sm">
                        {stepsData.map(s => (
                        <button key={s.id} onClick={()=> handleStepChange(s.id)}
                                    className={`px-4 py-1.5 rounded-full text-sm font-medium transition-all cursor-pointer ${currentStep === s.id ? 'bg-gray-900 text-white shadow-md' : 'text-gray-600 hover:text-gray-900'}`}
                                >
                                    {s.icon} {s.title}
                                </button> ))}
                    </div>
                    <div className="w-20 hidden md:block"></div>
                </nav>

                <div className="relative z-20 w-[92%] sm:w-[86%] lg:w-[65%] max-w-3xl mx-auto pt-8 animate-hero-rise">

                    <div className="md:hidden flex overflow-x-auto gap-2 pb-4 mb-4 scrollbar-none snap-x">
                        {stepsData.map(s => (
                        <button key={s.id} onClick={()=> handleStepChange(s.id)}
                                    className={`shrink-0 snap-start px-3 py-1.5 rounded-full text-xs font-medium transition-all cursor-pointer ${currentStep === s.id ? 'bg-gray-900 text-white shadow-md' : 'bg-white/80 text-gray-700 backdrop-blur-sm'}`}
                                >
                                    {s.icon} {s.title}
                                </button> ))}
                    </div>

                    <div className="quest-card p-6 sm:p-10 font-thai">
                        {currentStep === 1 && (
                        <div className="space-y-6">
                            <div className="border-b border-gray-200 pb-4 text-center sm:text-left">
                                <span className="text-[11px] font-bold text-gray-600 bg-gray-100 px-3 py-1 rounded-full uppercase tracking-wider">แบบทดสอบก่อนเรียน</span>
                                <h2 className="text-2xl font-extrabold text-gray-900 mt-3">แบบทดสอบก่อนเรียน (Pre-test)</h2>
                                <p className="text-sm text-gray-600 mt-1">กรุณาทำแบบทดสอบวัดความรู้พื้นฐานเรื่องภัยไซเบอร์ก่อนเข้าสู่บทเรียน</p>
                            </div>
                            <div className="embed-box bg-slate-50 border-dashed border-2 border-slate-200">
                                <div className="embed-inner">
                                    <span className="text-5xl mb-2">📝</span>
                                    <h3 className="font-bold text-base text-gray-900">Google Form แบบทดสอบก่อนเรียน</h3>
                                    <p className="text-xs text-gray-500 mt-1 max-w-md">(เมื่อนำโค้ด Embed iframe จาก Google Forms มาวางในพื้นที่นี้ ตัวแบบทดสอบจะแสดงผลทันที)</p>
                                </div>
                            </div>
                            <div className="flex justify-end pt-4 border-t border-gray-200">
                                <button onClick={()=> handleStepChange(2)} className="bg-gray-900 text-white text-sm font-semibold px-6 py-2.5 rounded-full hover:bg-gray-800 transition-all flex items-center gap-2 shadow-md cursor-pointer">
                                            ทำเสร็จแล้ว ไปขั้นตอนถัดไป ➔
                                        </button>
                            </div>
                        </div>
                        )} {currentStep === 2 && (
                        <div className="space-y-6">
                            <div className="border-b border-gray-200 pb-4 text-center sm:text-left">
                                <span className="text-[11px] font-bold text-gray-600 bg-gray-100 px-3 py-1 rounded-full uppercase tracking-wider">คลิปเรียน</span>
                                <h2 className="text-2xl font-extrabold text-gray-900 mt-3">คลิปวิดีโอบทเรียน Cyber Security</h2>
                                <p className="text-sm text-gray-600 mt-1">เรียนรู้หลักการตั้งรหัสผ่าน การรับมือกับ SMS/อีเมลหลอกลวง (Phishing) และการคุ้มครองข้อมูลส่วนบุคคล</p>
                            </div>
                            <div className="embed-box bg-slate-900 border-none shadow-inner">
                                <div className="embed-inner text-white">
                                    <span className="text-5xl mb-2">▶️</span>
                                    <h3 className="font-bold text-base">คลิปวิดีโอบทเรียนความปลอดภัยไซเบอร์ ม.3</h3>
                                    <p className="text-xs text-gray-400 mt-1 max-w-md">(ตัวเล่นวิดีโอจาก YouTube จะแสดงผลพร้อมการเรียนรู้ในพื้นที่นี้)</p>
                                </div>
                            </div>
                            <div className="flex justify-between items-center pt-4 border-t border-gray-200">
                                <button onClick={()=> handleStepChange(1)} className="text-gray-500 hover:text-gray-900 text-sm font-semibold px-4 py-2 transition-all cursor-pointer">
                                            ⬅ ย้อนกลับ
                                        </button>
                                <button onClick={()=> handleStepChange(3)} className="bg-gray-900 text-white text-sm font-semibold px-6 py-2.5 rounded-full hover:bg-gray-800 transition-all flex items-center gap-2 shadow-md cursor-pointer">
                                            รับชมจบแล้ว ไปมินิเกม ➔
                                        </button>
                            </div>
                        </div>
                        )} {currentStep === 3 && (
                        <div className="space-y-6">
                            <div className="border-b border-gray-200 pb-4 text-center sm:text-left">
                                <span className="text-[11px] font-bold text-gray-600 bg-gray-100 px-3 py-1 rounded-full uppercase tracking-wider">เกมปราบบอส</span>
                                <h2 className="text-2xl font-extrabold text-gray-900 mt-3">เกมปราบบอส 3 ด่าน</h2>
                                <p className="text-sm text-gray-600 mt-1">ตอบคำถามให้ถูกต้องในทั้ง 3 ด่าน เพื่อปราบบอสแฮกเกอร์และอนุมัติระบบของคุณ</p>

                                <div className="flex gap-2 mt-4 overflow-x-auto pb-2 scrollbar-none">
                                    <button onClick={()=> setActiveGame(1)} className={`px-4 py-2 rounded-xl font-bold text-xs shrink-0 transition-all cursor-pointer ${activeGame === 1 ? "bg-gray-900 text-white shadow-md" : "bg-gray-100 text-gray-700 hover:bg-gray-200"}`}>

                                    <button onClick={()=> setActiveGame(2)} className={`px-4 py-2 rounded-xl font-bold text-xs shrink-0 transition-all cursor-pointer ${activeGame === 2 ? "bg-gray-900 text-white shadow-md" : "bg-gray-100 text-gray-700 hover:bg-gray-200"}`}>
                                                ด่าน 2: ป้องกันฟิชชิ่ง

                                    <button onClick={()=> setActiveGame(3)} className={`px-4 py-2 rounded-xl font-bold text-xs shrink-0 transition-all cursor-pointer ${activeGame === 3 ? "bg-gray-900 text-white shadow-md" : "bg-gray-100 text-gray-700 hover:bg-gray-200"}`}>
                                                ด่าน 3: โจมตีบอส

                                </div>
                            </div>

                            {activeGame === 1 && (
                            <div className="bg-slate-50 p-6 rounded-2xl border border-gray-200 shadow-sm space-y-4 text-center">

                                <h3 className="font-extrabold text-lg text-white">ด่าน 2: เกมป้องกันฟิชชิ่ง</h3>
                                {!game1Passed &&
                                <p className="text-xs text-rose-500">⚠️ โปรดผ่านด่าน 1 (สร้างรหัสผ่าน) ก่อน</p>}
                                <p className="text-xs max-w-lg mx-auto text-gray-300">เลือกคำที่ดูน่าสงสัยในอีเมลตัวอย่าง เพื่อแยกแยะระหว่างข้อความปลอมและข้อความจริง</p>

                                {game1Passed && (
                                <div className="animate-fade-up">
                                    <div className="bg-slate-800 p-4 rounded-xl text-left max-w-xl mx-auto space-y-3">
                                        <div className="grid gap-2 text-sm">
                                            {phishingItems.map((item, idx) => (
                                            <button key={idx} onClick={()=> handlePhishingToggle(idx)} className={`w-full text-left rounded-xl border px-4 py-3 font-semibold transition-all cursor-pointer ${phishingSelections.includes(idx) ? "border-gray-400 bg-gray-500/20 text-gray-100" : "border-slate-700 bg-slate-900 text-slate-300 hover:border-gray-400/40 hover:bg-slate-800"}`}>
                                                                    {item.text}
                                                                </button> ))}
                                        </div>
                                    </div>
                                    <div className="flex flex-col gap-3 items-center mt-4">
                                        <button onClick={handlePhishingSubmit} className="bg-gray-200 hover:bg-white text-gray-900 font-bold px-6 py-2 rounded-full transition-all shadow-md cursor-pointer">ตรวจสอบคำตอบ</button>
                                        <button onClick={handlePhishingReset} className="text-slate-400 text-xs underline cursor-pointer">ล้างค่าลองใหม่</button>
                                    </div>
                                    {phishingResult && (
                                    <div className={`mt-4 rounded-xl border p-4 ${phishingResult.success ? "border-emerald-500/30 bg-emerald-500/10 text-emerald-300" : "border-rose-500/30 bg-rose-500/10 text-rose-300"}`}>
                                        <p className="text-sm font-semibold">{phishingResult.message}</p>
                                    </div>
                                    )} {phishingResult && phishingResult.success && (
                                    <button onClick={()=> setGame2Passed(true)} className="mt-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2 rounded-full transition-all cursor-pointer">
                                                            {game2Passed ? "✅ ผ่านด่าน 2 แล้ว" : "บันทึกผลผ่านด่าน 2"}
                                                        </button> )}
                                </div>
                                )}
                            </div>
                            )} {activeGame === 3 && (
                            <div className="bg-slate-900 p-6 rounded-2xl border border-gray-700 text-white text-center space-y-4">
                                <h3 className="font-extrabold text-lg text-white">ด่าน 3: โจมตีบอสแฮกเกอร์</h3>
                                {(!game1Passed || !game2Passed) &&
                                <p className="text-xs text-rose-400">⚠️ โปรดผ่านด่านที่ 1 และ 2 ก่อน</p>} {(game1Passed && game2Passed) && (
                                <div className="space-y-4 animate-fade-up">
                                    <div className="flex justify-between items-center text-xs font-bold text-gray-300 max-w-sm mx-auto">
                                        <span>พลังชีวิตบอส Hacker:</span>
                                        <span>{bossHP} / 100 HP</span>
                                    </div>
                                    <div className="w-full max-w-sm mx-auto h-4 bg-gray-800 rounded-full overflow-hidden border border-gray-700">
                                        <div className="h-full bg-rose-500 transition-all duration-300" style={{ width: `${bossHP}%` }}></div>
                                    </div>

                                    <div className="bg-white/5 p-5 rounded-xl border border-white/10 max-w-md mx-auto space-y-3">
                                        <p className="text-sm font-semibold">{bossQuestions[bossQuestionIndex].q}</p>
                                        <div className="flex flex-col gap-2">
                                            {bossQuestions[bossQuestionIndex].options.map((opt, idx) => (
                                            <button key={idx} onClick={()=> handleBossAttack(opt.correct)} className="w-full py-2.5 px-4 bg-gray-800 hover:bg-gray-700 rounded-xl text-xs font-bold transition-all text-left border border-gray-600 cursor-pointer">
                                                                    {opt.text}
                                                                </button> ))}
                                        </div>
                                    </div>
                                </div>
                                )} {bossDefeated && (
                                <div className="mt-6 p-6 bg-emerald-500/20 border border-emerald-500 rounded-2xl space-y-2 animate-hero-rise">
                                    <span className="text-5xl block mb-2">🏆</span>
                                    <h4 className="text-xl font-extrabold text-emerald-400">ยินดีด้วย! คุณปราบแฮกเกอร์สำเร็จแล้ว</h4>
                                    <p className="text-xs text-emerald-100/70">พร้อมเข้าสู่การทดสอบหลังเรียน</p>
                                </div>
                                )}
                            </div>
                            )}

                            <div className="flex justify-between items-center pt-4 border-t border-gray-200">
                                <button onClick={()=> handleStepChange(2)} className="text-gray-500 hover:text-gray-900 text-sm font-semibold px-4 py-2 transition-all cursor-pointer">
                                            ⬅ ย้อนกลับ
                                        </button>
                                <button onClick={()=> { bossDefeated ? handleStepChange(4) : alert('โปรดปราบแฮกเกอร์ให้เสร็จสิ้นก่อนครับ') }} className={`text-sm font-semibold px-6 py-2.5 rounded-full flex items-center gap-2 transition-all cursor-pointer ${bossDefeated ? "bg-gray-900 text-white shadow-md hover:bg-gray-800" : "bg-gray-200 text-gray-400"}`}>
                                            ไปทดสอบหลังเรียน ➔
                                        </button>
                            </div>
                        </div>
                        )} {currentStep === 4 && (
                        <div className="space-y-6">
                            <div className="border-b border-gray-200 pb-4 text-center sm:text-left">
                                <span className="text-[11px] font-bold text-gray-600 bg-gray-100 px-3 py-1 rounded-full uppercase tracking-wider">แบบทดสอบหลังเรียน</span>
                                <h2 className="text-2xl font-extrabold text-gray-900 mt-3">แบบทดสอบหลังเรียน (Post-test)</h2>
                                <p className="text-sm text-gray-600 mt-1">ทำแบบทดสอบหลังเรียนผ่าน Google Forms เพื่อประเมินผลความเข้าใจทั้งหมด</p>
                            </div>
                            <div className="embed-box bg-slate-50 border-dashed border-2 border-slate-200">
                                <div className="embed-inner">
                                    <span className="text-5xl mb-2">📊</span>
                                    <h3 className="font-bold text-base text-gray-900">Google Form แบบทดสอบหลังเรียน</h3>
                                    <p className="text-xs text-gray-500 mt-1 max-w-md">(นำโค้ด Embed iframe มาวางในพื้นที่นี้)</p>
                                </div>
                            </div>
                            <div className="flex justify-between items-center pt-4 border-t border-gray-200">
                                <button onClick={()=> handleStepChange(3)} className="text-gray-500 hover:text-gray-900 text-sm font-semibold px-4 py-2 transition-all cursor-pointer">
                                            ⬅ ย้อนกลับ
                                        </button>
                                <button onClick={()=> handleStepChange(5)} className="bg-gray-900 text-white text-sm font-semibold px-6 py-2.5 rounded-full hover:bg-gray-800 transition-all flex items-center gap-2 shadow-md cursor-pointer">
                                            รับเกียรติบัตร ➔
                                        </button>
                            </div>
                        </div>
                        )} {currentStep === 5 && (
                        <div className="space-y-6">
                            <div className="border-b border-gray-200 pb-4 text-center sm:text-left">
                                <span className="text-[11px] font-bold text-gray-600 bg-gray-100 px-3 py-1 rounded-full uppercase tracking-wider">สำเร็จการศึกษา</span>
                                <h2 className="text-2xl font-extrabold text-gray-900 mt-3">รับเกียรติบัตรออนไลน์ Smart Guard</h2>
                            </div>

                            <div className="bg-gradient-to-br from-amber-50 to-amber-100/60 border-2 border-amber-300 p-8 rounded-2xl text-center space-y-5 shadow-sm">
                                <h3 className="font-bold text-xl text-amber-900">🏆 ประกาศนียบัตรผ่านการอบรม</h3>
                                <p className="text-sm text-amber-800">ขอมอบเกียรติบัตรฉบับนี้ให้แก่</p>

                                <input type="text" value={studentName} onChange={(e)=> setStudentName(e.target.value)} placeholder="กรอกชื่อ-นามสกุล ของนักเรียน" className="w-full max-w-xs px-4 py-3 rounded-xl border-2 border-amber-300 text-center font-bold
                                text-gray-900 focus:outline-none focus:border-amber-600 bg-white" />

                                <p className="text-sm text-amber-800">เพื่อแสดงว่า ได้ผ่านการเรียนรู้ทักษะความมั่นคงปลอดภัยไซเบอร์ ม.3 เรียบร้อยแล้ว</p>

                                <div>
                                    <button onClick={()=> { studentName ? alert(`ดาวน์โหลดเกียรติบัตรสำเร็จสำหรับ: ${studentName}`) : alert('กรุณากรอกชื่อก่อนรับเกียรติบัตรครับ'); }} className="bg-gray-900 hover:bg-gray-800 text-white font-bold px-8 py-3 rounded-full transition-all shadow-md mt-2 cursor-pointer">
                                                🎓 ดาวน์โหลดเกียรติบัตร
                                            </button>
                                </div>
                            </div>

                            <div className="flex justify-start pt-4 border-t border-gray-200">
                                <button onClick={()=> handleStepChange(4)} className="text-gray-500 hover:text-gray-900 text-sm font-semibold px-4 py-2 transition-all cursor-pointer">
                                            ⬅ ย้อนกลับ
                                        </button>
                            </div>
                        </div>
                        )}

                    </div>
                </div>
            </div>
            ); } function App() { const [currentPage, setCurrentPage] = useState('home'); return (
            <div className="min-h-[100svh]">
                {currentPage === 'home' ? (
                <HomePage onStart={()=> { setCurrentPage('learning'); window.scrollTo(0, 0); }} /> ) : (
                    <LearningPage onBackToHome={()=> { setCurrentPage('home'); window.scrollTo(0, 0); }} /> )}
            </div>
            ); } const root = ReactDOM.createRoot(document.getElementById("root")); root.render(
            <App />);
    </script>
</body>

</html>
